# Development only. Production requires TLS, authentication, and a managed or secured replica set.
services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (!rs.status().ok) quit(1) } catch { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}) }; if (!db.hello().isWritablePrimary) quit(1)'"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  data:
